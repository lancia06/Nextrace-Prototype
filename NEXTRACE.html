<div class="flex gap-2"><input value=${ci} onInput=${e=>setCi(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send(ci)} placeholder="Ask about users, IPs, files or findings" class="flex-1 rounded-lg p-2 text-sm"/>${Bt('Send',()=>send(ci),busy||!ci.trim())}</div></div>`,

rep:()=>{const t=mkReport();return h`<div class="space-y-4 max-w-4xl"><div class="flex flex-wrap justify-between items-center gap-2"><h2 class="text-3xl font-extrabold hd">Report</h2>${Bt('Copy report',async()=>{try{await navigator.clipboard.writeText(t);log('Investigation report copied');notify('Report copied to clipboard','Low')}catch(e){setErr(x=>[...x,'Copy failed: '+e.message+'. Select the text manually.'])}})}</div>${errs.length>0&&h`<p class="text-xs text-red-300">${errs[errs.length-1]}</p>`}<div class="g p-4"><pre class="mono whitespace-pre-wrap break-words" style=${{fontSize:'.78rem',lineHeight:1.6}}>${t}</pre></div></div>`},


dash:()=>h`<div class="space-y-4"><div class="flex flex-wrap items-center gap-3 justify-between"><div><h2 class="text-3xl font-extrabold hd">Investigation overview</h2><p class="text-xs text-stone-500">Evidence figures come from uploaded files. The platform simulation below uses fictional data.</p></div><button onClick=${runSim} disabled=${run||ro} class="px-4 py-2 rounded-lg bg-orange-500 text-stone-900 border-2 border-stone-900 font-bold text-sm hover:bg-orange-400 disabled:opacity-50 transition">${run?'Simulation running…':'RUN SECURITY SIMULATION'}</button></div>
${EvOv()}<h3 class="hd text-lg font-bold pt-2">Platform simulation</h3><div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${KPI('Overall status',status[0],status[1])}${KPI('Critical alerts',stats.crit,'text-red-700')}${KPI('Protected credentials',creds.filter(c=>lvl(score(c))==='Low').length+' / '+creds.length)}${KPI('Suspicious activities',stats.sus,'text-amber-700')}${KPI('Blocked requests',stats.blk.toLocaleString())}${KPI('Protected vendors',vendors.length)}</div>
${(sim.length>0||run)&&Card('Simulation timeline',h`<ol class="space-y-3 border-l border-stone-400 ml-2">${sim.map((s,i)=>h`<li class="pl-4 relative pop"><span class="absolute -left-[5px] top-1.5 w-2 h-2 rounded-full bg-orange-500"></span><div class="text-sm font-medium">${s.a}</div><div class="text-xs text-stone-500">${s.t} · ${s.b}</div></li>`)}</ol>`)}
<div class="grid lg:grid-cols-2 gap-3">${Card('Incidents by category',Bars(KW,'#10b981'))}${Card('API activity, last 24 hours (requests per minute)',Area(AP))}${Card('Suspicious export jobs by day',Bars(EX,'#f9a8d4'))}${Card('Credential risk levels',Donut(risk))}</div>
${Card('Recent security events',evTbl(ev.slice(0,5)))}</div>`,

fin:()=>h`<div class="space-y-4"><h2 class="text-3xl font-extrabold hd">Financial transaction protection</h2>
<div class="grid lg:grid-cols-2 gap-3">${Card('Registered vendors',T(['ID','Vendor','Account'],vendors.map(v=>[v.id,v.n,'****'+v.a])))}
${Card('Request a bank-account change',h`<div class="space-y-2 text-sm"><select value=${fv} onChange=${e=>setFv(e.target.value)} class="w-full bg-white border-2 border-stone-900 rounded-lg p-2">${vendors.map(v=>h`<option value=${v.id}>${v.n} (${v.id})</option>`)}</select><input value=${fn} onInput=${e=>setFn(e.target.value)} maxlength="4" placeholder="New account, last 4 digits" class="w-full bg-white border-2 border-stone-900 rounded-lg p-2"/><input value=${fr} onInput=${e=>setFr(e.target.value)} placeholder="Approval reference (try AP-2026-118, or leave empty)" class="w-full bg-white border-2 border-stone-900 rounded-lg p-2"/><div class="flex gap-2">${Bt('Submit change',submitChg,ro)}${Bt('Load V-0412 example',()=>{setFv('V-0412');setFn('9083');setFr('');setFres(null)},false,'bg-white text-stone-900 hover:bg-stone-100')}</div>
${fres&&(fres.k==='err'?h`<p class="text-amber-700 text-xs">${fres.m}</p>`:fres.k==='blk'?h`<div class="p-3 rounded-lg bg-red-500/15 border border-red-400/30 pop"><div class="font-bold text-red-700 hd">BLOCKED – APPROVAL REQUIRED</div><div class="text-xs mt-1">${fres.v.n} · ${fres.v.id} · ****${fres.v.a} to ****${fres.to} · Approval reference: Missing</div></div>`:h`<div class="p-3 rounded-lg bg-emerald-500/15 border border-emerald-400/30 pop"><div class="font-bold text-emerald-700 hd">APPROVED</div><div class="text-xs mt-1">${fres.v.id} now ****${fres.to}. Recorded in the audit trail.</div></div>`)}</div>`)}</div>
${Card('Change history (requested by / approval)',T(['Time','Vendor','From','To','Approval ref','Requested by','Result'],chg.map(c=>[c.t,c.v,'****'+c.f,'****'+c.to,c.ref,c.by,c.st==='Baseline'?'—':B(c.st)])))}</div>`,

cred:()=>h`<div class="space-y-4"><h2 class="text-3xl font-extrabold hd">Credential manager</h2>${creds.map(c=>{const s=score(c),l=lvl(s);return h`<div class="g p-4"><div class="flex flex-wrap items-center gap-2 justify-between"><div><span class="font-semibold">${c.id}</span> <span class="text-stone-500 text-sm">· ${c.app}</span></div><div class="flex items-center gap-2">${c.rev?B('Revoked'):B(l)}<span class="text-xs text-stone-500">Risk score ${s}</span></div></div>
<div class="mt-2 flex flex-wrap gap-1.5 text-xs">${c.perms.map(p=>h`<span class=${'px-2 py-0.5 rounded '+(/write|export/.test(p)?'bg-red-500/15 text-red-700':'bg-stone-200')}>${p}</span>`)}</div>
<div class="text-xs text-stone-500 mt-2">Expiry: ${c.exp||'None'} · IP restriction: ${c.ip?'Yes':'None'}</div>
${!c.rev&&rec(c).length>0&&h`<div class="text-xs mt-2 text-orange-700">Least-privilege advice: ${rec(c).join('; ')}.</div>`}
<div class="flex flex-wrap gap-2 mt-3">${Bt('Rotate (simulated)',()=>{act(c.id,x=>({...x,exp:new Date(Date.now()+90*864e5).toISOString().slice(0,10)}));log('Rotated '+c.id+' (simulated); 90-day expiry set')},ro||c.rev||role==='Analyst'&&false)}${Bt('Restrict to approved IPs',()=>{act(c.id,x=>({...x,ip:true}));log('IP restriction added to '+c.id)},ro||c.rev||c.ip)}${Bt('Revoke',()=>{act(c.id,x=>({...x,rev:true}));log('Revoked '+c.id);notify(c.id+' revoked','Medium')},!canRev||c.rev,'bg-red-500/20 text-red-700 hover:bg-red-500/30')}</div></div>`})}${!canRev&&h`<p class="text-xs text-stone-500">Only the Admin role can revoke credentials. Auditors have read-only access.</p>`}</div>`,

api:()=>h`<div class="space-y-4"><h2 class="text-3xl font-extrabold hd">API behaviour monitoring</h2>${Card('Simulated API requests',evTbl(ev,true))}
${Card('Timeline of suspicious activity',h`<ol class="space-y-2 border-l border-red-400/30 ml-2">${ev.filter(e=>e.f==='Suspicious').map(e=>h`<li class="pl-4 text-sm"><span class="text-stone-500 text-xs">${e.t}</span> · ${e.act} <span class="text-stone-500">(${e.ip}, ${e.key})</span></li>`)}</ol>`)}
<p class="text-xs text-stone-500">Internal scheduled sync from 10.20.4.x is classified as Normal. Sample suspicious sources: 198.18.7.41 and 198.18.7.58.</p></div>`,

data:()=>h`<div class="space-y-4"><h2 class="text-3xl font-extrabold hd">Data protection and exposure</h2>
${Card('Support-ticket scanner',h`<textarea value=${tk} onInput=${e=>{setTk(e.target.value);setScan(null)}} rows="3" class="w-full bg-white border-2 border-stone-900 rounded-lg p-2 text-sm"></textarea><div class="mt-2">${Bt('Scan ticket',()=>{const m=tk.match(/\b(bvk|key|tok)-[a-z0-9]{3,}\b/gi)||[];setScan(m.map(x=>x.slice(0,6)+'••••'));if(m.length){notify('Exposed credential found in ticket (simulated)','High');log('Ticket scan found '+m.length+' exposed credential(s)')}},ro)}</div>
${scan&&(scan.length?h`<div class="mt-3 p-3 rounded-lg bg-red-500/15 border border-red-400/30 pop text-sm"><b class="text-red-700">Credential exposure alert.</b> Found: ${scan.join(', ')} (masked). Rotate the key and remove it from the ticket. ${Bt('Open credential manager',()=>go('cred'))}</div>`:h`<p class="mt-3 text-sm text-emerald-700">No credential patterns found.</p>`)}`)}
${Card('Confidential file-access history',T(['Time','Key','File','Activity','Result'],F0.map(f=>[f.t,f.key,f.file,f.act,B(f.f)])))}</div>`,

inc:()=>{const c=inc.find(x=>x.id===sel)||inc[0];return h`<div class="space-y-4"><h2 class="text-3xl font-extrabold hd">Incident management</h2><div class="grid lg:grid-cols-2 gap-3">${Card('Alerts and incidents',T(['ID','Title','Severity','Status'],inc.map(x=>[h`<button class="text-orange-700 underline" onClick=${()=>setSel(x.id)}>${x.id}</button>`,x.title,B(x.sev),B(x.st)])))}
${c&&Card(c.id+' · '+c.title,h`<div class="space-y-3 text-sm"><div class="flex flex-wrap gap-2 items-center"><label class="text-xs text-stone-500">Status</label><select disabled=${ro} value=${c.st} onChange=${e=>setSt(c.id,'st',e.target.value)} class="bg-white border-2 border-stone-900 rounded p-1 text-xs">${['New','Investigating','Contained','Resolved'].map(s=>h`<option>${s}</option>`)}</select><label class="text-xs text-stone-500">Owner</label><select disabled=${ro} value=${c.own} onChange=${e=>setSt(c.id,'own',e.target.value)} class="bg-white border-2 border-stone-900 rounded p-1 text-xs">${['Unassigned','Security Admin','SOC Analyst'].map(s=>h`<option>${s}</option>`)}</select></div>
<ol class="space-y-1 border-l border-stone-400 ml-2">${c.tl.map(t=>h`<li class="pl-3 text-xs"><span class="text-stone-500">${t[0]}</span> ${t[1]}</li>`)}</ol>
<div><div class="text-xs text-stone-500 mb-1">Recommended response</div><ul class="list-disc ml-5 text-xs space-y-0.5">${c.rc.map(r=>h`<li>${r}</li>`)}</ul></div>${Bt('Create incident report',()=>setRep(c))}</div>`)}</div></div>`},

aud:()=>h`<div class="space-y-4"><h2 class="text-3xl font-extrabold hd">Security event history and audit trail</h2>${Card('Audit trail',T(['Time','User','Action'],aud.map(a=>[a.t,a.u,a.m])))}</div>`,

help:()=>h`<div class="space-y-4 max-w-3xl"><h2 class="text-3xl font-extrabold hd">Help and documentation</h2>${Card('How NEXTRACE covers the five problems',h`<ul class="text-sm space-y-2 list-disc ml-5"><li><b>Unauthorised bank changes:</b> Financial protection blocks any change without an approval reference.</li><li><b>Misused API credentials:</b> Credential manager scores risk, flags missing expiry and IP limits, and simulates rotation and revocation.</li><li><b>Bulk exports:</b> API monitoring flags unusual volumes and sources, and simulates blocking.</li><li><b>Exposed credentials:</b> Data exposure scans tickets and shows masked results only.</li><li><b>Evidence investigation:</b> Evidence tabs analyse uploaded .log/.txt/.csv/.json files, correlate shared users, IPs and files, answer questions with file references and build a structured report.</li><li><b>Slow response:</b> Incidents tracks status, owner, timeline and an audit trail.</li></ul><p class="text-xs text-stone-500 mt-3">Roles: Admin can do everything, Analyst cannot revoke keys, Auditor is read-only. Start with “RUN SECURITY SIMULATION” on the dashboard. Everything here is fictional and local to this page; it provides no real protection.</p>`)}</div>`};

return h`<div class="min-h-screen"><header class="bg-stone-900 sticky top-0 z-30"><div class="flex items-center gap-3 px-4 py-3 relative"><div class="hd font-extrabold text-lg whitespace-nowrap text-white"><span class="inline-block bg-orange-500 text-stone-900 px-1.5 mr-1.5 rounded-sm">N</span>NEXTRACE<span class="hidden lg:inline text-xs font-normal text-stone-500 ml-2">Digital Forensic Intelligence &amp; Incident Investigation</span></div><div class="flex-1 relative max-w-xl ml-auto"><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Search vendors, keys, incidents, events" class="w-full bg-white border-2 border-stone-900 rounded-lg px-3 py-2 text-sm"/>${results.length>0&&h`<div class="absolute z-20 mt-1 w-full g p-1 bg-white">${results.map(r=>h`<button onClick=${()=>{go(r[2]);setQ('')}} class="w-full text-left px-3 py-2 text-sm rounded hover:bg-orange-100">${r[0]} <span class="text-xs text-stone-500">· ${r[1]}</span></button>`)}</div>`}</div>
<button onClick=${()=>setBell(!bell)} class="relative px-3 py-2 rounded-md bg-stone-200 text-white text-sm border border-white/25">Alerts <span class="ml-1 px-1.5 rounded-full bg-orange-500 text-stone-900 font-bold text-xs">${notes.length}</span></button><span class="text-xs text-stone-300 hidden sm:block">${user} · ${role}</span>${Bt('Sign out',()=>setUser(null),false,'bg-stone-200 text-stone-900')}
${bell&&h`<div class="absolute right-3 top-14 z-30 w-80 max-w-[92vw] g p-3 bg-white pop max-h-96 overflow-auto"><div class="flex justify-between mb-2 text-sm font-semibold">Notification centre ${Bt('Clear',()=>setN([]),false,'bg-stone-200 text-stone-900')}</div>${notes.length?notes.map(n=>h`<div class="py-2 border-t border-stone-200 text-xs"><div>${n.m}</div><div class="text-stone-500 mt-0.5">${n.t} ${B(n.s)}</div></div>`):h`<p class="text-xs text-stone-500">No notifications. Run the simulation to generate some.</p>`}</div>`}</div><nav class="flex gap-1 px-3 overflow-x-auto border-t border-white/15">${NAV.map(([k,l])=>h`<button onClick=${()=>go(k)} class=${'whitespace-nowrap px-4 py-2.5 text-sm font-semibold transition '+(view===k?'bg-orange-500 text-stone-900':'text-stone-300 hover:bg-stone-200')}>${l}</button>`)}</nav></header>
<main class="p-4 md:p-8 max-w-6xl mx-auto pop" key=${view}>${views[view]()}</main>
${rep&&h`<div class="fixed inset-0 z-40 bg-stone-900/70 grid place-items-center p-4" onClick=${()=>setRep(null)}><div class="g bg-white p-5 max-w-lg w-full pop" onClick=${e=>e.stopPropagation()}><h3 class="hd font-bold mb-2">Incident report: ${rep.id}</h3><pre class="text-xs whitespace-pre-wrap bg-white p-3 rounded-lg max-h-72 overflow-auto">${'NEXTRACE · INCIDENT REPORT (SIMULATED DATA)\nID: '+rep.id+'\nTitle: '+rep.title+'\nSeverity: '+rep.sev+'\nStatus: '+rep.st+'\nOwner: '+rep.own+'\n\nTimeline:\n'+rep.tl.map(t=>'- '+t[0]+' '+t[1]).join('\n')+'\n\nRecommended response:\n'+rep.rc.map(r=>'- '+r).join('\n')+'\n\nAll data is fictional.'}</pre><div class="flex gap-2 mt-3">${Bt('Copy report',()=>{try{navigator.clipboard.writeText(document.querySelector('pre').innerText);log('Report for '+rep.id+' copied')}catch(e){}})}${Bt('Close',()=>setRep(null),false,'bg-stone-200 text-stone-900')}</div></div></div>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
